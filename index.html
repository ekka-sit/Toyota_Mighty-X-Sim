<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Mighty-X Web Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .status {
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            background-color: #333;
        }

        .status.connected {
            background-color: #28a745;
            color: white;
        }

        .dashboard-container {
            display: flex;
            gap: 40px;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .gauge-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gauge {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2a2a 60%, #111 100%);
            border: 6px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* เข็มเรือนไมล์ */
        .needle {
            position: absolute;
            width: 4px;
            height: 90px;
            background-color: #ff3333;
            bottom: 50%;
            transform-origin: bottom center;
            transform: rotate(-120deg); /* จุดเริ่มต้นที่ 0 */
            border-radius: 2px;
            box-shadow: 0 0 5px rgba(255, 51, 51, 0.8);
            
            /* หัวใจสำคัญ: ปรับ Smooth Transition ให้สอดคล้องกับ STM32 ที่ส่งทุก 200ms */
            transition: transform 0.2s ease-out;
        }

        .needle-cap {
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .gauge-title {
            margin-top: 15px;
            font-size: 18px;
            color: #aaa;
        }

        .gauge-value {
            margin-top: 5px;
            font-size: 24px;
            font-weight: bold;
            color: #00e676;
        }
    </style>
</head>
<body>

    <h1>Toyota Mighty-X (2L) Dashboard</h1>

    <div class="controls">
        <button id="connectBtn">เชื่อมต่อ STM32 (Serial)</button>
        <span id="statusText" class="status">ยังไม่ได้เชื่อมต่อ</span>
    </div>

    <div class="dashboard-container">
        <!-- Gauge 1: RPM -->
        <div class="gauge-card">
            <div class="gauge">
                <div id="rpmNeedle" class="needle"></div>
                <div class="needle-cap"></div>
            </div>
            <div class="gauge-title">รอบเครื่องยนต์ (RPM)</div>
            <div id="rpmValue" class="gauge-value">0</div>
        </div>

        <!-- Gauge 2: Velocity -->
        <div class="gauge-card">
            <div class="gauge">
                <div id="speedNeedle" class="needle"></div>
                <div class="needle-cap"></div>
            </div>
            <div class="gauge-title">ความเร็ว (KM/H)</div>
            <div id="speedValue" class="gauge-value">0.0</div>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const rpmNeedle = document.getElementById('rpmNeedle');
        const speedNeedle = document.getElementById('speedNeedle');
        const rpmValue = document.getElementById('rpmValue');
        const speedValue = document.getElementById('speedValue');

        let port;
        let reader;
        let inputBuffer = ""; // Buffer สะสมข้อความจาก Serial Stream

        connectBtn.addEventListener('click', async () => {
            if ('serial' in navigator) {
                try {
                    // 1. เลือกพอร์ต Serial (ST-Link / USB Serial)
                    port = await navigator.serial.requestPort();

                    // 2. ตั้งค่า Baud Rate 9600 ให้ตรงกับ STM32 (USART2->BRR = 0x683)
                    await port.open({ baudRate: 9600 });

                    statusText.textContent = "เชื่อมต่อสำเร็จ (9600 Baud)";
                    statusText.classList.add('connected');
                    connectBtn.disabled = true;

                    // 3. เริ่มลูปอ่านข้อมูล
                    readSerialData();
                } catch (err) {
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err.message);
                }
            } else {
                alert("เบราว์เซอร์นี้ไม่รองรับ Web Serial API (แนะนำให้ใช้ Google Chrome หรือ Edge)");
            }
        });

        async function readSerialData() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            while (true) {
                const { value, done } = await reader.read();
                if (done) {
                    reader.releaseLock();
                    break;
                }

                if (value) {
                    // สะสมข้อความเข้า Buffer
                    inputBuffer += value;

                    // แยกสายข้อมูลด้วยบรรทัดใหม่ (\n)
                    let lines = inputBuffer.split('\n');

                    // เก็บข้อความท่อนสุดท้ายที่ยังไม่สมบูรณ์ไว้ใน Buffer สำหรับรอบถัดไป
                    inputBuffer = lines.pop();

                    // นำบรรทัดที่สมบูรณ์แล้วไปประมวลผล
                    for (let line of lines) {
                        parseLineData(line.trim());
                    }
                }
            }
        }

        function parseLineData(line) {
            if (!line) return;

            // ข้อมูลถูกส่งมาในรูปแบบ CSV: <RPM>,<VELOCITY> (เช่น "800.0,0.0")
            const parts = line.split(',');

            if (parts.length === 2) {
                const rpm = parseFloat(parts[0]);
                const velocity = parseFloat(parts[1]);

                // กรองข้อความขยะ ป้องกันไม่ให้ค่า NaN หรือข้อความ Debug ทำลายการแสดงผล
                if (!isNaN(rpm) && !isNaN(velocity)) {
                    updateDashboard(rpm, velocity);
                }
            }
        }

        function updateDashboard(rpm, velocity) {
            // 1. อัปเดตตัวเลขแสดงผล
            rpmValue.textContent = Math.round(rpm);
            speedValue.textContent = velocity.toFixed(1);

            // 2. คำนวณมุมหมุนของเข็มเรือนไมล์ (มุมเริ่มที่ -120 deg ถึง +120 deg)
            // RPM Max = 4500 RPM
            const maxRpm = 4500.0;
            const rpmClamped = Math.min(Math.max(rpm, 0), maxRpm);
            const rpmDeg = -120 + (rpmClamped / maxRpm) * 240;

            // Speed Max = 180 km/h
            const maxSpeed = 180.0;
            const speedClamped = Math.min(Math.max(velocity, 0), maxSpeed);
            const speedDeg = -120 + (speedClamped / maxSpeed) * 240;

            // 3. ปรับการหมุนของเข็มผ่าน CSS Transform
            rpmNeedle.style.transform = `rotate(${rpmDeg}deg)`;
            speedNeedle.style.transform = `rotate(${speedDeg}deg)`;
        }
    </script>
</body>
</html>
